<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sudoku Boy</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku Boy">
<meta name="theme-color" content="#060912">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --race:"DIN Condensed","Avenir Next Condensed","Bahnschrift SemiBold Condensed","Bahnschrift","Arial Narrow","DejaVu Sans Condensed",sans-serif;
  --ui:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif;
  --cyan:#2be4ff; --red:#ff3b30; --orange:#ff8a1a; --lime:#3cf07a; --amber:#ffc61a; --violet:#b06bff;
  --glass:rgba(10,15,28,.93); --edge:rgba(43,228,255,.55);
}
html,body{margin:0;height:100%;overflow:hidden;background:#05070d;position:fixed;inset:0;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;font-family:var(--ui);color:#e9f1ff;}
button{font-family:inherit;cursor:pointer;}
#bg{position:fixed;inset:0;width:100%;height:100%;}
#stage{position:absolute;left:0;top:0;width:810px;height:1080px;transform-origin:0 0;}
.screen{position:absolute;inset:0;display:none;}
.screen.on{display:block;animation:screenIn .22s ease-out;}
@keyframes screenIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50;}

/* ---------- title ---------- */
#title{position:absolute;left:0;right:0;top:34px;text-align:center;font:italic 900 104px/1 var(--race);letter-spacing:2px;
  color:#fff;text-transform:uppercase;text-shadow:0 0 18px rgba(43,228,255,.65),0 4px 0 #0a3a52,0 8px 22px rgba(0,0,0,.8);}
#title b{font-weight:900;background:linear-gradient(180deg,#ffd29a 0%,#ff8a1a 45%,#ff3b30 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 0 12px rgba(255,90,40,.55)) drop-shadow(0 4px 0 #4a0d06);}
#tag{position:absolute;left:0;right:0;top:152px;text-align:center;font:italic 700 25px var(--race);letter-spacing:9px;color:var(--cyan);text-transform:uppercase;}
#tag i{display:inline-block;width:120px;height:4px;vertical-align:7px;margin:0 16px;
  background:repeating-linear-gradient(90deg,var(--cyan) 0 18px,transparent 18px 26px);transform:skewX(-30deg);}

/* ---------- menu ---------- */
#mlist{position:absolute;left:0;top:214px;width:640px;}
.mbtn{position:relative;display:block;box-sizing:border-box;width:100%;height:62px;margin:0 0 11px -20px;padding:0 0 0 64px;text-align:left;
  font:italic 700 33px/62px var(--race);letter-spacing:.5px;color:#fff;border:0;transform:skewX(-14deg);
  background:linear-gradient(90deg,rgba(18,28,50,.96) 0%,rgba(18,28,50,.92) 62%,rgba(18,28,50,0) 100%);
  box-shadow:inset 6px 0 0 var(--cyan),inset 0 1px 0 rgba(255,255,255,.12);opacity:0;animation:slideIn .38s ease-out forwards;}
.mbtn > span{display:inline-block;transform:skewX(14deg);}
.mbtn small{display:inline-block;transform:skewX(14deg);font:italic 600 23px var(--race);color:var(--lime);margin-left:14px;letter-spacing:.5px;}
.mbtn.hot{box-shadow:inset 6px 0 0 var(--orange),inset 0 1px 0 rgba(255,255,255,.12);}
.mbtn.gap{margin-top:26px;}
.mbtn:active{background:linear-gradient(90deg,rgba(43,228,255,.45),rgba(43,228,255,0));}
@keyframes slideIn{from{opacity:0;transform:skewX(-14deg) translateX(-60px)}to{opacity:1;transform:skewX(-14deg)}}
#mfoot{position:absolute;left:0;right:0;bottom:44px;display:flex;justify-content:center;gap:22px;}
#mver{position:absolute;left:22px;bottom:12px;font:italic 600 17px var(--race);letter-spacing:1px;color:rgba(200,230,255,.55);}

/* pills */
.pill{box-sizing:border-box;height:60px;min-width:190px;padding:0 28px;border:0;border-radius:6px;transform:skewX(-12deg);
  font:italic 700 30px/60px var(--race);letter-spacing:1px;text-transform:uppercase;color:#06121c;
  background:linear-gradient(180deg,#ffffff 0%,#dfe6f0 55%,#b8c3d3 100%);box-shadow:0 4px 0 #5d6b80,0 8px 16px rgba(0,0,0,.5);}
.pill > span{display:inline-block;transform:skewX(12deg);}
.pill:active{transform:skewX(-12deg) translateY(3px);box-shadow:0 1px 0 #5d6b80,0 3px 8px rgba(0,0,0,.5);}
.pill.go{background:linear-gradient(180deg,#8dffb5 0%,#34e06f 50%,#11a345 100%);box-shadow:0 4px 0 #0a5e27,0 8px 16px rgba(0,0,0,.5);}
.pill.warn{background:linear-gradient(180deg,#ffd0a0 0%,#ff8a1a 55%,#d4560a 100%);box-shadow:0 4px 0 #7a2c04,0 8px 16px rgba(0,0,0,.5);}
.pill.off{background:#4a5466;color:#7c889c;box-shadow:none;}
.pill.small{height:50px;min-width:0;padding:0 20px;font-size:25px;line-height:50px;}

/* ---------- game ---------- */
#frame{position:absolute;left:56px;top:24px;width:698px;height:757px;border-radius:18px 18px 8px 8px;overflow:hidden;
  background:#05070d;box-shadow:0 0 0 2px var(--edge),0 0 26px rgba(43,228,255,.28),0 18px 40px rgba(0,0,0,.7);}
#head{position:absolute;left:0;top:0;right:0;height:56px;background:linear-gradient(180deg,#1a2540,#0c1322);border-bottom:1px solid rgba(43,228,255,.35);}
#hlevel{position:absolute;left:18px;top:10px;height:36px;padding:0 18px;transform:skewX(-14deg);border-radius:4px;
  font:italic 700 27px/36px var(--race);letter-spacing:1px;text-transform:uppercase;color:#06121c;background:var(--lime);}
#hlevel > span{display:inline-block;transform:skewX(14deg);}
#hlevel.lvM{background:var(--lime);} #hlevel.lvI{background:var(--amber);} #hlevel.lvD{background:#ff5a4a;}
#hlevel.lvA{background:var(--violet);color:#fff;} #hlevel.lvT{background:var(--cyan);} #hlevel.wrong{background:#ff2a2a;color:#fff;}
#htime{position:absolute;right:22px;top:4px;font:italic 700 42px/48px var(--race);letter-spacing:2px;color:#fff;
  font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(43,228,255,.6);}
#htime small{font:italic 600 17px var(--race);letter-spacing:3px;color:var(--cyan);margin-right:10px;vertical-align:6px;}
#pace{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08);}
#paceFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#11c6ff,var(--cyan));box-shadow:0 0 8px var(--cyan);}
#paceFill.late{background:linear-gradient(90deg,var(--orange),var(--red));box-shadow:0 0 8px var(--red);}
#paceMark{position:absolute;top:-4px;bottom:-4px;width:3px;background:#fff;left:80%;}
#board{position:absolute;left:0;top:59px;width:698px;height:698px;background:#000;}
.cell{position:absolute;width:74px;height:74px;background:#fff;overflow:hidden;}
.cell.alt{background:#ececec;}
.cell .d{position:absolute;inset:0;text-align:center;font:bold 62px Helvetica,Arial,sans-serif;line-height:76px;color:#000;}
.cell.given .d{color:#1414e6;}
.cell.bad .d{color:#e01010;}
.cell.hy{background:#fff56a;}
.cell.hp{background:#ffc7d6;}
.cell.sel{background:#5fe35f;}
.cell .pm{position:absolute;inset:3px;display:none;}
.cell.showpm .pm{display:block;}
.cell .pm i{position:absolute;width:33.33%;height:33.33%;text-align:center;font:normal 17px Helvetica,Arial,sans-serif;line-height:23px;color:#333;visibility:hidden;font-style:normal;}
.cell .pm.sol i{color:#b02020;font-weight:bold;}
.cell .pm.sq i,.cell .pm.dot i{font-size:0;}
.cell .pm.sq i::after,.cell .pm.dot i::after{content:'';display:block;width:11px;height:11px;margin:6px auto 0;background:#4a64b8;}
.cell .pm.dot i::after{border-radius:50%;}
.cell .fx{position:absolute;inset:0;opacity:0;pointer-events:none;}
.cell .fx.by{background:#ffe600;animation:blink .55s ease-out;}
.cell .fx.bg{background:#35d435;animation:blink .7s ease-out;}
.cell.pop .d{animation:pop .18s ease-out;}
@keyframes pop{from{transform:scale(1.35)}to{transform:scale(1)}}
@keyframes blink{0%{opacity:.95}35%{opacity:.25}60%{opacity:.85}100%{opacity:0}}
.cell.hg{background:#7fe07f;}
.cell.hb{background:#8fc4ff;}
.cell.hf{background:#ffb26b;}
.cell.ht{background:#fff56a;box-shadow:inset 0 0 0 4px #0b7d0b;}
.cell.hr{background:#ff9d9d;}

/* racing board skin */
.skin-racing .cell{background:#16213a;}
.skin-racing .cell.alt{background:#1f2c4a;}
.skin-racing .cell .d{color:#ffffff;}
.skin-racing .cell.given .d{color:#6fd6ff;}
.skin-racing .cell.bad .d{color:#ff5a5a;}
.skin-racing .cell .pm i{color:#a9bddf;}
.skin-racing .cell.hy{background:#c9a300;}
.skin-racing .cell.hy .d{color:#111;}
.skin-racing .cell.hp{background:#7a2c64;}
.skin-racing .cell.sel{background:#1d9a4a;}
.skin-racing .cell.hg{background:#1f7a3a;} .skin-racing .cell.hb{background:#235c9e;} .skin-racing .cell.hf{background:#a8571a;}
.skin-racing .cell.ht{background:#c9a300;box-shadow:inset 0 0 0 4px #3cf07a;} .skin-racing .cell.hr{background:#8f2222;}

/* overlays on the board */
.cover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
  background:radial-gradient(circle at 50% 45%,#141f38,#05070d 75%);}
.cover.on{display:flex;}
#lights{display:flex;gap:22px;padding:22px 30px;background:#0b0f18;border-radius:16px;box-shadow:inset 0 0 0 2px #222c40,0 10px 30px rgba(0,0,0,.6);}
#lights i{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#3a1010,#160606);box-shadow:inset 0 0 0 4px #000;}
#lights i.lit{background:radial-gradient(circle at 40% 35%,#ffb0a0,#ff2a1a 45%,#8a0a04);box-shadow:0 0 26px #ff2a1a,inset 0 0 0 4px #000;}
.coverText{margin-top:30px;font:italic 800 40px var(--race);letter-spacing:6px;color:#c8d8f0;text-transform:uppercase;}
.coverText.go{color:var(--lime);font-size:96px;text-shadow:0 0 24px var(--lime);}
#pausedTxt{font:italic 900 96px var(--race);letter-spacing:10px;color:#fff;text-shadow:0 0 20px var(--cyan);}
#flagWipe{position:absolute;inset:0;pointer-events:none;opacity:0;
  background:repeating-conic-gradient(#fff 0 25%,#0a0a0a 0 50%) 0 0/58px 58px;}
#flagWipe.run{animation:wipe 1.1s ease-in-out;}
@keyframes wipe{0%{opacity:.0;clip-path:inset(0 100% 0 0)}25%{opacity:.85;clip-path:inset(0 30% 0 0)}55%{opacity:.85;clip-path:inset(0 0 0 0)}100%{opacity:0;clip-path:inset(0 0 0 100%)}}

/* keypad panel */
.panel{position:absolute;left:56px;top:798px;width:698px;height:252px;box-sizing:border-box;border-radius:16px;
  background:
    repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 4px,rgba(0,0,0,0) 4px 8px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.03) 0 4px,rgba(0,0,0,0) 4px 8px),
    linear-gradient(180deg,#1b2436,#0e1422);
  box-shadow:0 0 0 2px var(--edge),0 12px 30px rgba(0,0,0,.6);transition:box-shadow .2s,background .2s;}
.panel.unsolvable{box-shadow:0 0 0 3px #ff2a2a,0 0 30px rgba(255,40,40,.7);background:linear-gradient(180deg,#5a1414,#2a0808);}
#keys{padding:13px 11px 0 11px;}
.krow{display:flex;justify-content:space-between;}
#rowBig{height:66px;margin-bottom:9px;}
#rowSmall{height:58px;margin-bottom:11px;}
#rowCtl{height:60px;}
.key{box-sizing:border-box;border:0;background:linear-gradient(180deg,#ffffff 0%,#e7ecf3 55%,#c6cfdc 100%);color:#0a1220;border-radius:14px;padding:0;margin:0;position:relative;
  box-shadow:0 4px 0 #56637a,0 6px 10px rgba(0,0,0,.55);transition:transform .05s;}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #56637a,0 2px 5px rgba(0,0,0,.5);}
.big{width:68px;height:62px;font:bold 46px/62px Helvetica,Arial,sans-serif;}
.small{width:68px;height:54px;border-radius:12px;}
.small i{position:absolute;font:bold 17px Helvetica,Arial,sans-serif;font-style:normal;width:20px;text-align:center;line-height:16px;}
.ctl{width:106px;height:56px;font:italic 700 28px/56px var(--race);letter-spacing:1px;text-transform:uppercase;}
.key.on{background:linear-gradient(180deg,#9dffbf 0%,#2ee06a 50%,#0c9a3d 100%);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55);box-shadow:0 4px 0 #075a24,0 0 16px rgba(60,240,122,.7);}
.key.fin{background:linear-gradient(180deg,#fff3b0 0%,#ffd84a 55%,#e0a800 100%);}
.key.fin.on{background:linear-gradient(180deg,#9dffbf 0%,#2ee06a 50%,#0c9a3d 100%);color:#ffe94a;}
.key.off{background:#3a4356;color:#6b778c;box-shadow:0 2px 0 #222a38;}
.sub{display:none;padding:18px 24px;}
.sub p{margin:0;font:26px/34px var(--ui);color:#e9f1ff;}
.sub p b{color:var(--lime);}
.subBtns{position:absolute;left:0;right:0;bottom:22px;display:flex;justify-content:center;gap:22px;}
.hinting #keys,.done #keys,.paused #keys{display:none;}
.hinting #hintbox,.done #result,.paused #pausebox{display:block;}
#result p.rbig{font:italic 800 44px/50px var(--race);letter-spacing:1px;color:#fff;}
#result p.rbig em{font-style:italic;color:var(--amber);margin-left:12px;}
#result p.rmid{font:23px/30px var(--ui);color:#cfe0f5;margin-top:6px;}
#result p.pb{font:italic 800 26px var(--race);letter-spacing:3px;color:var(--orange);text-transform:uppercase;margin-top:4px;}
#pausebox p{text-align:center;font:italic 700 30px var(--race);letter-spacing:4px;color:var(--cyan);text-transform:uppercase;}

/* ---------- sheets (lists, stats, settings, help) ---------- */
.sheet{position:absolute;left:36px;top:32px;width:738px;height:1016px;box-sizing:border-box;background:var(--glass);
  clip-path:polygon(0 0,calc(100% - 34px) 0,100% 34px,100% 100%,34px 100%,0 calc(100% - 34px));
  box-shadow:inset 0 0 0 2px var(--edge);}
.sheet h1{margin:0;height:84px;padding-left:40px;font:italic 900 46px/84px var(--race);letter-spacing:3px;text-transform:uppercase;color:#fff;
  background:linear-gradient(90deg,rgba(43,228,255,.22),rgba(43,228,255,0) 70%);border-bottom:2px solid var(--edge);position:relative;}
.sheet h1::after{content:'';position:absolute;right:56px;top:26px;width:140px;height:32px;opacity:.8;
  background:repeating-conic-gradient(#fff 0 25%,transparent 0 50%) 0 0/16px 16px;transform:skewX(-14deg);}
.sheet .body{position:absolute;left:0;right:0;top:86px;bottom:100px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 34px;touch-action:pan-y;}
.sheet .foot{position:absolute;left:0;right:0;bottom:24px;display:flex;justify-content:center;gap:24px;}
table.st{width:100%;border-collapse:collapse;font:24px var(--ui);color:#e9f1ff;}
table.st th,table.st td{padding:10px 6px;text-align:right;border-bottom:1px solid rgba(160,190,230,.18);}
table.st th:first-child,table.st td:first-child{text-align:left;}
table.st thead th{font:italic 700 21px var(--race);letter-spacing:2px;text-transform:uppercase;color:var(--cyan);border-bottom:2px solid var(--edge);}
table.st td b{font:italic 700 26px var(--race);letter-spacing:1px;}
h2.sec{font:italic 800 30px var(--race);letter-spacing:3px;text-transform:uppercase;color:var(--orange);margin:28px 0 10px 0;}
.note{font:20px/27px var(--ui);color:#a9bad3;margin:12px 0;}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px;padding:10px 0;border-bottom:1px solid rgba(160,190,230,.18);}
.srow .lab{font:italic 700 28px var(--race);letter-spacing:1px;color:#fff;}
.srow .lab span{display:block;font:19px/25px var(--ui);color:#a9bad3;margin-top:3px;letter-spacing:0;}
.seg{display:flex;flex:none;}
.seg button{height:48px;padding:0 15px;font:italic 700 22px var(--race);letter-spacing:.5px;border:2px solid #4a5a78;background:#121a2c;color:#cfe0f5;margin-left:-2px;}
.seg button:first-child{border-radius:10px 0 0 10px;margin-left:0;}
.seg button:last-child{border-radius:0 10px 10px 0;}
.seg button.on{background:var(--cyan);border-color:var(--cyan);color:#04121a;}
.lrow{display:flex;align-items:center;gap:18px;min-height:84px;border-bottom:1px solid rgba(160,190,230,.18);padding:6px 0;}
.lrow .chip{flex:none;width:150px;height:40px;transform:skewX(-14deg);border-radius:4px;text-align:center;font:italic 700 24px/40px var(--race);letter-spacing:1px;text-transform:uppercase;color:#06121c;}
.lrow .chip span{display:inline-block;transform:skewX(14deg);}
.lrow .info{flex:1;font:22px/28px var(--ui);color:#cfe0f5;}
.lrow .info b{display:block;font:italic 700 28px var(--race);letter-spacing:1px;color:#fff;}
.lrow .info .done{color:var(--lime);}
.chip.lvM{background:var(--lime);} .chip.lvI{background:var(--amber);} .chip.lvD{background:#ff5a4a;} .chip.lvA{background:var(--violet);color:#fff;} .chip.lvT{background:var(--cyan);}
.xbtn{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid #4a5a78;background:#121a2c;color:#a9bad3;font:bold 26px var(--ui);}
.tech{display:flex;align-items:flex-start;gap:18px;padding:14px 0;border-bottom:1px solid rgba(160,190,230,.18);}
.tick{flex:none;width:46px;height:46px;border-radius:10px;border:3px solid #6a7da0;background:#0c1322;margin-top:4px;position:relative;}
.tick.on{background:var(--lime);border-color:var(--lime);}
.tick.on::after{content:'';position:absolute;left:13px;top:4px;width:12px;height:24px;border:solid #04121a;border-width:0 5px 5px 0;transform:rotate(45deg);}
.tech .t b{display:block;font:italic 700 30px var(--race);letter-spacing:1px;color:#fff;}
.tech .t b small{font:italic 600 20px var(--race);color:var(--violet);margin-left:10px;letter-spacing:1px;}
.tech .t span{font:20px/27px var(--ui);color:#a9bad3;}
.help p,.help li{font:21px/30px var(--ui);color:#d8e4f5;margin:6px 0;}
.help b{color:#fff;}
.help ul{margin:4px 0;padding-left:28px;}
.help .sw{display:inline-block;width:26px;height:20px;border:2px solid #fff;vertical-align:-3px;margin-right:6px;}
</style>
</head>
<body>
<svg id="bg" viewBox="0 0 810 1080" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050b"/><stop offset=".45" stop-color="#0a1430"/><stop offset=".62" stop-color="#2a1240"/><stop offset=".66" stop-color="#ff5a2a"/><stop offset=".661" stop-color="#0b0f1e"/><stop offset="1" stop-color="#04060c"/>
    </linearGradient>
    <radialGradient id="gsun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb347" stop-opacity=".9"/><stop offset=".6" stop-color="#ff3b6b" stop-opacity=".35"/><stop offset="1" stop-color="#ff3b6b" stop-opacity="0"/></radialGradient>
    <linearGradient id="gfloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2be4ff" stop-opacity=".0"/><stop offset=".25" stop-color="#2be4ff" stop-opacity=".45"/><stop offset="1" stop-color="#2be4ff" stop-opacity=".18"/></linearGradient>
    <pattern id="chk" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#fff"/><rect x="12" y="12" width="12" height="12" fill="#fff"/></pattern>
  </defs>
  <rect width="810" height="1080" fill="url(#gsky)"/>
  <circle cx="405" cy="712" r="260" fill="url(#gsun)"/>
  <g stroke="#ff5a2a" stroke-opacity=".5" stroke-width="3"><line x1="250" y1="660" x2="560" y2="660"/><line x1="230" y1="676" x2="580" y2="676"/><line x1="220" y1="690" x2="590" y2="690"/></g>
  <!-- perspective track grid -->
  <g stroke="url(#gfloor)" stroke-width="2" fill="none">
    <path d="M405 714 L-600 1080"/><path d="M405 714 L-250 1080"/><path d="M405 714 L40 1080"/><path d="M405 714 L250 1080"/>
    <path d="M405 714 L560 1080"/><path d="M405 714 L770 1080"/><path d="M405 714 L1060 1080"/><path d="M405 714 L1410 1080"/>
    <path d="M0 734 H810"/><path d="M0 760 H810"/><path d="M0 796 H810"/><path d="M0 846 H810"/><path d="M0 916 H810"/><path d="M0 1010 H810"/>
  </g>
  <!-- kerbs along the track edges -->
  <path d="M405 714 L120 1080" stroke="#ff3b30" stroke-width="10" stroke-dasharray="22 22" opacity=".7"/>

const CORE = (function () {
'use strict';
// Sudoku Boy core: geometry, brute-force solver, technique-grading logical solver.

const HOUSES = [];
for (let r = 0; r < 9; r++) { const h = []; for (let c = 0; c < 9; c++) h.push(r * 9 + c); HOUSES.push(h); }
for (let c = 0; c < 9; c++) { const h = []; for (let r = 0; r < 9; r++) h.push(r * 9 + c); HOUSES.push(h); }
for (let b = 0; b < 9; b++) {
  const h = []; const r0 = 3 * Math.floor(b / 3), c0 = 3 * (b % 3);
  for (let i = 0; i < 9; i++) h.push((r0 + Math.floor(i / 3)) * 9 + c0 + (i % 3));
  HOUSES.push(h);
}
const ROWOF = i => Math.floor(i / 9);
const COLOF = i => i % 9;
const BOXOF = i => 3 * Math.floor(Math.floor(i / 9) / 3) + Math.floor((i % 9) / 3);
const PEERS = [];
const ISPEER = [];
for (let i = 0; i < 81; i++) {
  const s = new Set();
  for (const h of [HOUSES[ROWOF(i)], HOUSES[9 + COLOF(i)], HOUSES[18 + BOXOF(i)]]) for (const j of h) if (j !== i) s.add(j);
  PEERS.push([...s]);
  const a = new Uint8Array(81); for (const j of s) a[j] = 1; ISPEER.push(a);
}
const ALL = 511;
const BIT = d => 1 << (d - 1);
const PC = new Uint8Array(512);
for (let m = 1; m < 512; m++) PC[m] = PC[m >> 1] + (m & 1);
const DIGIT_OF = {}; for (let d = 1; d <= 9; d++) DIGIT_OF[BIT(d)] = d;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };

function shuffle(arr, rnd) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }

// Count solutions up to `limit`. If `out` given, first solution is copied into it.
// If rnd given, candidate order is randomised (used to make random full grids).
function solveCount(grid, limit, out, rnd) {
  const v = Int8Array.from(grid);
  const rows = new Int32Array(9), cols = new Int32Array(9), boxes = new Int32Array(9);
  for (let i = 0; i < 81; i++) if (v[i]) {
    const b = BIT(v[i]), r = ROWOF(i), c = COLOF(i), x = BOXOF(i);
    if ((rows[r] | cols[c] | boxes[x]) & b) return 0;
    rows[r] |= b; cols[c] |= b; boxes[x] |= b;

  let count = 0;
  (function rec() {
    let best = -1, bm = 0, bn = 10;
    for (let i = 0; i < 81; i++) if (!v[i]) {
      const m = ALL & ~(rows[ROWOF(i)] | cols[COLOF(i)] | boxes[BOXOF(i)]);

      if (n === 0) return;
      if (n < bn) { bn = n; best = i; bm = m; if (n === 1) break; }

    const r = ROWOF(best), c = COLOF(best), x = BOXOF(best);
    let bits = [];

// opts.cand: starting candidates (default: from givens). opts.oneStep: stop after one deduction and
// return { tech, focus, log } describing it (used by the in-game hint).
// opts.allow: array of technique codes the solver may use (default: all).
function grade(puz, sol, opts) {
  opts = opts || {};
  const order = opts.allow ? TECH_ORDER.filter(t => opts.allow.includes(t)) : TECH_ORDER;
  const val = Int8Array.from(puz);
  const cand = new Int32Array(81);
  for (let i = 0; i < 81; i++) if (!val[i]) {
    let m = ALL; for (const p of PEERS[i]) if (val[p]) m &= ~BIT(val[p]);
    cand[i] = opts.cand ? (m & opts.cand[i]) : m;
  }
  const log = [];
  let focus = null;
  let left = 0; for (let i = 0; i < 81; i++) if (!val[i]) left++;
  const counts = {}; for (const t of TECH_ORDER) counts[t] = 0;
  const urTypes = [0, 0, 0, 0, 0];

  function setv(i, d, why) {
    if (sol[i] !== d) throw new Error('bad placement by ' + why + ' at ' + i);
    log.push({ cell: i, place: d });
    val[i] = d; cand[i] = 0; left--;
    const b = BIT(d); for (const p of PEERS[i]) cand[p] &= ~b;
  }
  function elim(i, mask, why) {
    const m = cand[i] & mask; if (!m) return false;
    if (m & BIT(sol[i])) throw new Error('bad elimination by ' + why + ' at ' + i);
    log.push({ cell: i, remove: m });
    cand[i] &= ~mask; return true;
  }

  const T = {
    FH() {
      for (const h of HOUSES) {
        let n = 0, cell = -1; for (const i of h) if (!val[i]) { n++; cell = i; }
        if (n === 1) { focus = { house: HOUSES.indexOf(h) }; setv(cell, DIGIT_OF[cand[cell]], 'FH'); return true; }
      }
      return false;
    },
    hidden(from, to, why) {
      for (let hi = from; hi < to; hi++) {
        const h = HOUSES[hi];
        for (let d = 1; d <= 9; d++) {
          const b = BIT(d); let n = 0, cell = -1;
          for (const i of h) if (cand[i] & b) { n++; cell = i; }
          if (n === 1) { focus = { house: hi, digit: d }; setv(cell, d, why); return true; }
        }
      }
      return false;
    },
    HSB() { return T.hidden(18, 27, 'HSB'); },
    HSL() { return T.hidden(0, 18, 'HSL'); },
    NS() {
      for (let i = 0; i < 81; i++) if (!val[i] && PC[cand[i]] === 1) { focus = { house: 18 + BOXOF(i) }; setv(i, DIGIT_OF[cand[i]], 'NS'); return true; }
      return false;
    },
    PT() {
      for (let bi = 18; bi < 27; bi++) {
        const h = HOUSES[bi];
        for (let d = 1; d <= 9; d++) {
          const b = BIT(d); const cells = h.filter(i => cand[i] & b);
          if (cells.length < 2) continue;
          let ch = false; focus = { house: bi, digit: d, cells };
          if (cells.every(i => ROWOF(i) === ROWOF(cells[0]))) {
            for (const i of HOUSES[ROWOF(cells[0])]) if (BOXOF(i) !== bi - 18) ch = elim(i, b, 'PT') || ch;
          } else if (cells.every(i => COLOF(i) === COLOF(cells[0]))) {
            for (const i of HOUSES[9 + COLOF(cells[0])]) if (BOXOF(i) !== bi - 18) ch = elim(i, b, 'PT') || ch;
          }
          if (ch) return true;
        }
      }
      return false;
    },
    CL() {
      for (let li = 0; li < 18; li++) {
        const h = HOUSES[li];
        for (let d = 1; d <= 9; d++) {
          const b = BIT(d); const cells = h.filter(i => cand[i] & b);
          if (cells.length < 2) continue;
          const bx = BOXOF(cells[0]);
          if (!cells.every(i => BOXOF(i) === bx)) continue;
          let ch = false; focus = { house: li, digit: d, cells };
          for (const i of HOUSES[18 + bx]) if (!cells.includes(i)) ch = elim(i, b, 'CL') || ch;
          if (ch) return true;
        }
      }
      return false;
    },
    naked(n, why) {
      for (const h of HOUSES) {
        const em = h.filter(i => !val[i]);
        if (em.length <= n) continue;
        const pool = em.filter(i => PC[cand[i]] <= n);
        if (pool.length < n) continue;
        const idx = [];
        const rec = (start, mask) => {
          if (idx.length === n) {
            if (PC[mask] !== n) return false;
            let ch = false; focus = { house: HOUSES.indexOf(h), cells: idx.slice() };
            for (const i of em) if (!idx.includes(i)) ch = elim(i, mask, why) || ch;
            return ch;
          }
          for (let k = start; k < pool.length; k++) {
            const m2 = mask | cand[pool[k]];
            if (PC[m2] > n) continue;
            idx.push(pool[k]);
            if (rec(k + 1, m2)) return true;
            idx.pop();
          }
          return false;
        };
        if (rec(0, 0)) return true;
      }
      return false;
    },
    NP() { return T.naked(2, 'NP'); },
    NT() { return T.naked(3, 'NT'); },
    HP() {
      for (const h of HOUSES) {
        for (let a = 1; a <= 8; a++) for (let b = a + 1; b <= 9; b++) {
          const ma = BIT(a), mb = BIT(b);
          const cells = h.filter(i => cand[i] & (ma | mb));
          if (cells.length !== 2) continue;
          if (!(cand[cells[0]] & ma) || !(cand[cells[1]] & ma) || !(cand[cells[0]] & mb) || !(cand[cells[1]] & mb)) continue;
          let ch = false; focus = { house: HOUSES.indexOf(h), cells: cells.slice() };
          for (const i of cells) ch = elim(i, ALL & ~(ma | mb), 'HP') || ch;
          if (ch) return true;
        }
      }
      return false;
    },
    XW() {
      for (let d = 1; d <= 9; d++) {
        const b = BIT(d);
        for (let orient = 0; orient < 2; orient++) {
          const masks = [];
          for (let l = 0; l < 9; l++) {
            let m = 0;
            for (let k = 0; k < 9; k++) { const i = orient === 0 ? l * 9 + k : k * 9 + l; if (cand[i] & b) m |= 1 << k; }
            masks.push(m);
          }
          for (let l1 = 0; l1 < 8; l1++) {
            if (PC[masks[l1]] !== 2) continue;
            for (let l2 = l1 + 1; l2 < 9; l2++) {
              if (masks[l2] !== masks[l1]) continue;
              let ch = false; const fc = [];
              for (let k = 0; k < 9; k++) if (masks[l1] & (1 << k)) for (const l of [l1, l2]) fc.push(orient === 0 ? l * 9 + k : k * 9 + l);
              focus = { digit: d, cells: fc };
              for (let k = 0; k < 9; k++) if (masks[l1] & (1 << k)) {
                for (let l = 0; l < 9; l++) if (l !== l1 && l !== l2) {
                  const i = orient === 0 ? l * 9 + k : k * 9 + l;
                  ch = elim(i, b, 'XW') || ch;
                }
              }
              if (ch) return true;
            }
          }
        }
      }
      return false;
    },
    UR() {
      for (let r1 = 0; r1 < 8; r1++) for (let r2 = r1 + 1; r2 < 9; r2++) {
        const sameBand = Math.floor(r1 / 3) === Math.floor(r2 / 3);
        for (let c1 = 0; c1 < 8; c1++) for (let c2 = c1 + 1; c2 < 9; c2++) {
          const sameStack = Math.floor(c1 / 3) === Math.floor(c2 / 3);
          if (sameBand === sameStack) continue; // must span exactly two boxes
          const cells = [r1 * 9 + c1, r1 * 9 + c2, r2 * 9 + c1, r2 * 9 + c2];
          if (cells.some(i => val[i])) continue;
          const common = cand[cells[0]] & cand[cells[1]] & cand[cells[2]] & cand[cells[3]];
          focus = { cells };
          if (PC[common] < 2) continue;
          for (let a = 1; a <= 8; a++) for (let b = a + 1; b <= 9; b++) {
            const ab = BIT(a) | BIT(b);
            if ((common & ab) !== ab) continue;
            const exact = cells.filter(i => cand[i] === ab);
            const roof = cells.filter(i => cand[i] !== ab);
            if (exact.length === 3) { // Type 1
              if (elim(roof[0], ab, 'UR1')) { urTypes[1]++; return true; }
              continue;
            }
            if (exact.length !== 2) continue;
            const [x, y] = roof;
            const sameRow = ROWOF(x) === ROWOF(y), sameCol = COLOF(x) === COLOF(y);
            if (!sameRow && !sameCol) continue; // diagonal: not types 2-4
            const shared = [];
            if (sameRow) shared.push(HOUSES[ROWOF(x)]);
            if (sameCol) shared.push(HOUSES[9 + COLOF(x)]);
            if (BOXOF(x) === BOXOF(y)) shared.push(HOUSES[18 + BOXOF(x)]);
            // Type 2
            const ex = cand[x] & ~ab;
            if (cand[x] === cand[y] && PC[ex] === 1) {
              let ch = false;
              for (let i = 0; i < 81; i++) if (i !== x && i !== y && ISPEER[x][i] && ISPEER[y][i]) ch = elim(i, ex, 'UR2') || ch;
              if (ch) { urTypes[2]++; return true; }
            }
            // Type 4
            for (const h of shared) {
              for (const [p, q] of [[a, b], [b, a]]) {
                const mp = BIT(p);
                if (h.some(i => i !== x && i !== y && (cand[i] & mp))) continue;
                let ch = false;
                ch = elim(x, BIT(q), 'UR4') || ch; ch = elim(y, BIT(q), 'UR4') || ch;
                if (ch) { urTypes[4]++; return true; }
              }
            }
            // Type 3
            const E = (cand[x] | cand[y]) & ~ab;
            for (const h of shared) {
              const others = h.filter(i => i !== x && i !== y && !val[i]);
              for (let n = 1; n <= 3; n++) {
                if (others.length <= n) break;
                const pick = [];
                const rec = (start, mask) => {
                  if (pick.length === n) {
                    if (PC[mask] !== n + 1) return false;
                    let ch = false;
                    for (const i of others) if (!pick.includes(i)) ch = elim(i, mask, 'UR3') || ch;
                    return ch;
                  }
                  for (let k = start; k < others.length; k++) {
                    const m2 = mask | cand[others[k]];
                    if (PC[m2] > n + 1) continue;
                    pick.push(others[k]);
                    if (rec(k + 1, m2)) return true;
                    pick.pop();
                  }
                  return false;
                };
                if (PC[E] <= n + 1 && rec(0, E)) { urTypes[3]++; return true; }
              }
            }
          }
        }
      }
      return false;
    },
    RP() {
      const seenPairs = new Set();
      for (let s = 0; s < 81; s++) {
        if (val[s] || PC[cand[s]] !== 2 || seenPairs.has(cand[s])) continue;
        const ab = cand[s]; seenPairs.add(ab);
        const nodes = []; for (let i = 0; i < 81; i++) if (!val[i] && cand[i] === ab) nodes.push(i);
        if (nodes.length < 4) continue;
        const colour = new Int8Array(81).fill(-1), comp = new Int8Array(81).fill(-1);
        let nc = 0;
        for (const st of nodes) {
          if (colour[st] >= 0) continue;
          const members = [st]; colour[st] = 0; comp[st] = nc;
          for (let q = 0; q < members.length; q++) {
            const u = members[q];
            for (const w of nodes) if (colour[w] < 0 && ISPEER[u][w]) { colour[w] = 1 - colour[u]; comp[w] = nc; members.push(w); }
          }
          if (members.length >= 4) {
            let ch = false; focus = { cells: members.slice() };
            for (let z = 0; z < 81; z++) {
              if (val[z] || !(cand[z] & ab) || comp[z] === nc) continue;
              let s0 = false, s1 = false;
              for (const m of members) if (ISPEER[z][m]) { if (colour[m] === 0) s0 = true; else s1 = true; }
              if (s0 && s1) ch = elim(z, ab, 'RP') || ch;
            }
            if (ch) return true;
          }
          nc++;
        }
      }
      return false;
    },
    BUG() {
      let tri = -1;
      for (let i = 0; i < 81; i++) if (!val[i]) {
        const n = PC[cand[i]];
        if (n === 2) continue;
        if (n === 3 && tri < 0) { tri = i; continue; }
        return false;
      }
      if (tri < 0) return false;
      for (let d = 1; d <= 9; d++) {
        const b = BIT(d); if (!(cand[tri] & b)) continue;
        // strict BUG test: without d in the trivalue cell, every candidate appears exactly twice in every house
        let ok = true;
        for (const h of HOUSES) {
          for (let e = 1; e <= 9 && ok; e++) {
            const be = BIT(e); let n = 0;
            for (const i of h) if ((cand[i] & be) && !(i === tri && e === d)) n++;
            if (n !== 0 && n !== 2) ok = false;
          }
          if (!ok) break;
        }
        if (ok) { focus = { cells: [tri] }; setv(tri, d, 'BUG'); return true; }
      }
      return false;
    },
    // ---- Annoying ----
    // positions of digit b along line l (orient 0 = rows as base, 1 = columns as base), as a 9-bit mask
    lineMask(b, orient, l) {
      let m = 0;
      for (let k = 0; k < 9; k++) { const i = orient === 0 ? l * 9 + k : k * 9 + l; if (cand[i] & b) m |= 1 << k; }
      return m;
    },
    fish(n, why) {
      for (let d = 1; d <= 9; d++) {
        const b = BIT(d);
        for (let orient = 0; orient < 2; orient++) {
          const masks = []; for (let l = 0; l < 9; l++) masks.push(T.lineMask(b, orient, l));
          const lines = []; for (let l = 0; l < 9; l++) if (PC[masks[l]] >= 2 && PC[masks[l]] <= n) lines.push(l);
          const pick = [];
          const rec = (start, cover) => {
            if (pick.length === n) {
              if (PC[cover] !== n) return false;
              let ch = false; const fc = [];
              for (const l of pick) for (let k = 0; k < 9; k++) if (masks[l] & (1 << k)) fc.push(orient === 0 ? l * 9 + k : k * 9 + l);
              focus = { digit: d, cells: fc, orient };
              for (let k = 0; k < 9; k++) if (cover & (1 << k)) for (let l = 0; l < 9; l++) if (!pick.includes(l)) {
                ch = elim(orient === 0 ? l * 9 + k : k * 9 + l, b, why) || ch;
              }
              return ch;
            }
            for (let x = start; x < lines.length; x++) {
              const c2 = cover | masks[lines[x]];
              if (PC[c2] > n) continue;
              pick.push(lines[x]); if (rec(x + 1, c2)) return true; pick.pop();
            }
            return false;
          };
          if (rec(0, 0)) return true;
        }
      }
      return false;
    },
    SF() { return T.fish(3, 'SF'); },
    HT() {
      for (const h of HOUSES) {
        const free = []; for (let d = 1; d <= 9; d++) { const n = h.filter(i => cand[i] & BIT(d)).length; if (n >= 2 && n <= 3) free.push(d); }
        for (let a = 0; a < free.length; a++) for (let b2 = a + 1; b2 < free.length; b2++) for (let c = b2 + 1; c < free.length; c++) {
          const m = BIT(free[a]) | BIT(free[b2]) | BIT(free[c]);
          const cells = h.filter(i => cand[i] & m);
          if (cells.length !== 3) continue;
          let ch = false; focus = { house: HOUSES.indexOf(h), cells: cells.slice(), digits: [free[a], free[b2], free[c]] };
          for (const i of cells) ch = elim(i, ALL & ~m, 'HT') || ch;
          if (ch) return true;
        }
      }
      return false;
    },
    WW() {
      const bv = []; for (let i = 0; i < 81; i++) if (!val[i] && PC[cand[i]] === 2) bv.push(i);
      for (let p = 0; p < bv.length; p++) for (let q = p + 1; q < bv.length; q++) {
        const A = bv[p], B = bv[q];
        if (cand[A] !== cand[B] || ISPEER[A][B]) continue;
        const ds = []; for (let d = 1; d <= 9; d++) if (cand[A] & BIT(d)) ds.push(d);
        for (const [x, y] of [[ds[0], ds[1]], [ds[1], ds[0]]]) {
          const bx = BIT(x);
          for (const h of HOUSES) {
            const cs = h.filter(i => cand[i] & bx);
            if (cs.length !== 2 || cs.includes(A) || cs.includes(B)) continue;
            let [L1, L2] = cs;
            if (!(ISPEER[L1][A] && ISPEER[L2][B])) { if (ISPEER[L2][A] && ISPEER[L1][B]) { const t = L1; L1 = L2; L2 = t; } else continue; }
            let ch = false; focus = { cells: [A, B, L1, L2], digit: y, link: x, house: HOUSES.indexOf(h) };
            for (let i = 0; i < 81; i++) if (i !== A && i !== B && ISPEER[A][i] && ISPEER[B][i]) ch = elim(i, BIT(y), 'WW') || ch;
            if (ch) return true;
          }
        }
      }
      return false;
    },
    // Finned and sashimi fish: n base lines whose candidates fit n cover lines except for fins inside one box.
    finned(n, why) {
      for (let d = 1; d <= 9; d++) {
        const b = BIT(d);
        for (let orient = 0; orient < 2; orient++) {
          const masks = []; for (let l = 0; l < 9; l++) masks.push(T.lineMask(b, orient, l));
          const lines = []; for (let l = 0; l < 9; l++) if (PC[masks[l]] >= 1 && PC[masks[l]] <= n + 2) lines.push(l);
          const at = (l, k) => orient === 0 ? l * 9 + k : k * 9 + l;
          const pick = [];
          const tryCover = () => {
            let U = 0; for (const l of pick) U |= masks[l];
            if (PC[U] <= n) return false;            // a plain fish, handled elsewhere
            const ks = []; for (let k = 0; k < 9; k++) if (U & (1 << k)) ks.push(k);
            const cpick = [];
            const recC = (start) => {
              if (cpick.length === n) {
                let C = 0; for (const k of cpick) C |= 1 << k;
                if (pick.some(l => !(masks[l] & C))) return false;
                const fins = []; for (const l of pick) for (let k = 0; k < 9; k++) if ((masks[l] & (1 << k)) && !(C & (1 << k))) fins.push(at(l, k));
                const fb = BOXOF(fins[0]);
                if (!fins.every(f => BOXOF(f) === fb)) return false;
                const sashimi = pick.some(l => PC[masks[l] & C] === 1);
                const fc = []; for (const l of pick) for (let k = 0; k < 9; k++) if (masks[l] & C & (1 << k)) fc.push(at(l, k));
                let ch = false; focus = { digit: d, cells: fc, fins, sashimi, orient };
                for (const k of cpick) for (let l = 0; l < 9; l++) {
                  if (pick.includes(l)) continue;
                  const z = at(l, k);
                  if (BOXOF(z) === fb) ch = elim(z, b, why) || ch;
                }
                return ch;
              }
              for (let x = start; x < ks.length; x++) { cpick.push(ks[x]); if (recC(x + 1)) return true; cpick.pop(); }
              return false;
            };
            return recC(0);
          };
          const rec = (start) => {
            if (pick.length === n) return tryCover();
            for (let x = start; x < lines.length; x++) { pick.push(lines[x]); if (rec(x + 1)) return true; pick.pop(); }
            return false;
          };
          if (rec(0)) return true;
        }
      }
      return false;
    },
    FXW() { return T.finned(2, 'FXW'); },
    FSF() { return T.finned(3, 'FSF'); },
    // ---- beyond Annoying (Training) ----
    XY() {
      for (let P = 0; P < 81; P++) {
        if (val[P] || PC[cand[P]] !== 2) continue;
        const wings = PEERS[P].filter(i => !val[i] && PC[cand[i]] === 2 && PC[cand[i] & cand[P]] === 1);
        for (let a = 0; a < wings.length; a++) for (let c = a + 1; c < wings.length; c++) {
          const A = wings[a], B = wings[c];
          if ((cand[A] & cand[P]) === (cand[B] & cand[P])) continue;
          const z = cand[A] & cand[B] & ~cand[P];
          if (PC[z] !== 1 || (cand[A] | cand[B] | cand[P]) !== (cand[P] | z)) continue;
          let ch = false; focus = { cells: [P, A, B], digit: DIGIT_OF[z] };
          for (let i = 0; i < 81; i++) if (i !== A && i !== B && ISPEER[A][i] && ISPEER[B][i]) ch = elim(i, z, 'XY') || ch;
          if (ch) return true;
        }
      }
      return false;
    },
    XYZ() {
      for (let P = 0; P < 81; P++) {
        if (val[P] || PC[cand[P]] !== 3) continue;
        const wings = PEERS[P].filter(i => !val[i] && PC[cand[i]] === 2 && (cand[i] & ~cand[P]) === 0);
        for (let a = 0; a < wings.length; a++) for (let c = a + 1; c < wings.length; c++) {
          const A = wings[a], B = wings[c];
          if (cand[A] === cand[B]) continue;
          const z = cand[A] & cand[B];
          if (PC[z] !== 1) continue;
          let ch = false; focus = { cells: [P, A, B], digit: DIGIT_OF[z] };
          for (let i = 0; i < 81; i++) if (i !== P && i !== A && i !== B && ISPEER[P][i] && ISPEER[A][i] && ISPEER[B][i]) ch = elim(i, z, 'XYZ') || ch;
          if (ch) return true;
        }
      }
      return false;
    },
    SC() {
      for (let d = 1; d <= 9; d++) {
        const b = BIT(d);
        const adj = new Map();
        for (const h of HOUSES) {
          const cs = h.filter(i => cand[i] & b);
          if (cs.length !== 2) continue;
          for (const [u, w] of [[cs[0], cs[1]], [cs[1], cs[0]]]) { if (!adj.has(u)) adj.set(u, new Set()); adj.get(u).add(w); }
        }
        const colour = new Map();
        for (const st of adj.keys()) {
          if (colour.has(st)) continue;
          const comp = [st]; colour.set(st, 0);
          for (let q = 0; q < comp.length; q++) for (const w of adj.get(comp[q])) if (!colour.has(w)) { colour.set(w, 1 - colour.get(comp[q])); comp.push(w); }
          if (comp.length < 4) continue;
          const side = [comp.filter(c => colour.get(c) === 0), comp.filter(c => colour.get(c) === 1)];
          // colour wrap: two cells of one colour see each other, so that colour is false
          for (let k = 0; k < 2; k++) {
            const s = side[k];
            let clash = false;
            for (let x = 0; x < s.length && !clash; x++) for (let y = x + 1; y < s.length; y++) if (ISPEER[s[x]][s[y]]) { clash = true; break; }
            if (clash) {
              let ch = false; focus = { cells: comp, digit: d, colourA: side[0], colourB: side[1], wrap: k };
              for (const c of s) ch = elim(c, b, 'SC') || ch;
              if (ch) return true;
            }
          }
          // colour trap: a cell that sees both colours cannot hold the digit

// ---------------- rendering ----------------
function render() {
  if (!G) return;
  $('board').className = S.skin === 'racing' ? 'skin-racing' : '';
  const hd = S.highlight ? hlDigit(G) : 0, hb = hd ? bit(hd) : 0;
  const hm = hint ? hintMarks(hint, hintStage) : null;
  const pmBase = 'pm' + (S.pmStyle === 'squares' ? ' sq' : S.pmStyle === 'dots' ? ' dot' : '');
  for (let i = 0; i < 81; i++) {
    const c = cells[i], v = G.val[i];
    let cls = 'cell' + (c.alt ? ' alt' : '') + (G.given[i] ? ' given' : '');
    const eff = v ? 0 : effCand(G, i, S.pencilMode);
    if (hm) { if (hm[i]) cls += ' ' + hm[i]; }
    else if (G.sel.type === 'cell' && G.sel.cell === i) cls += ' sel';
    else if (hd) { if (v === hd) cls += ' hy'; else if (eff & hb) cls += ' hp'; }
    if ((S.marks === 'illogical' && isBad(G, i)) || (S.marks === 'incorrect' && isWrong(G, i))) cls += ' bad';
    let pmMask = (S.pmStyle !== 'off' && !v) ? eff : 0, pmCls = pmBase;
    if (G.solShown && !v) { pmMask = bit(G.sol[i]); pmCls = 'pm sol'; }
    if (c.pmCls !== pmCls) { c.pm.className = pmCls; c.pmCls = pmCls; }
    if (pmMask) cls += ' showpm';
    if (c.cls !== cls) { c.el.className = cls; c.cls = cls; }
    const txt = v ? '' + v : '';
    if (c.txt !== txt) { c.d.textContent = txt; c.txt = txt; }
    if (c.pmMask !== pmMask) { for (let n = 0; n < 9; n++) c.pm.children[n].style.visibility = (pmMask >> n) & 1 ? 'visible' : 'hidden'; c.pmMask = pmMask; }
  }
  const s = G.sel;
  for (let n = 1; n <= 9; n++) {
    bigKeys[n - 1].className = 'key big' + (digitCount(G, n) === 9 ? ' fin' : '') + (s.type === 'digit' && s.n === n ? ' on' : '');
    smallKeys[n - 1].className = 'key small' + (s.type === 'pencil' && s.n === n ? ' on' : '');
  }
  $('kErase').className = 'key ctl' + (s.type === 'erase' ? ' on' : '');
  $('kPencil').className = 'key ctl' + (G.pencilOn ? ' on' : '');
  $('kUndo').className = 'key ctl' + (G.undo.length ? '' : ' off');
  $('kRedo').className = 'key ctl' + (G.redo.length ? '' : ' off');
  const wrong = !G.done && isFull(G);
  const lv = $('hlevel');
  lv.className = wrong ? 'wrong' : 'lv' + G.level;
  lv.firstChild.textContent = wrong ? 'Not solved yet' : G.level === 'T' ? 'Training' : (G.daily && G.date !== dateKey(new Date()) ? G.date.slice(5) + ' · ' : '') + LEVELS[G.level];
  const unsolv = S.solvable && !G.done && !solvable(G, S.pencilMode);
  $('panel').className = 'panel' + (G.done ? ' done' : paused ? ' paused' : hint ? ' hinting' : '') + (unsolv ? ' unsolvable' : '');
  $('pauseCover').className = 'cover' + (paused ? ' on' : '');
  if (!paused) $('ptext').textContent = 'Paused — clock stopped';
  if (hint) {
    $('htext').innerHTML = hintStage === 0 ? '<b>Board check:</b> no mistakes so far. Tap More for a hint (adds time).' : hintStage === 1 ? hint.t1 : hint.t2;
    $('bHintMore').className = 'pill small' + (hintStage < 2 ? '' : ' off');
    $('bFill').style.display = S.pencilMode === 'auto' ? 'none' : '';
    $('bSolution').firstChild.textContent = 'Solution';
  }
  showTime();
}

function show(name) {
  screen = name;
  for (const id of ['menu', 'game', 'stats', 'settings', 'help', 'list']) $(id).className = 'screen' + (id === name ? ' on' : '');
  if (name === 'menu') renderMenu();
  if (name === 'stats') renderStats();
  if (name === 'settings') renderSettings();
  if (name === 'help') renderHelp();
  if (name === 'game') render();
}

function renderMenu() {
  const list = $('mlist'); list.innerHTML = '';
  let k = 0;
  const add = (label, extra, fn, cls) => {
    const b = document.createElement('button'); b.className = 'mbtn' + (cls ? ' ' + cls : '');
    b.style.animationDelay = (k++ * 0.045) + 's';
    const sp = document.createElement('span'); sp.textContent = label; b.appendChild(sp);
    if (extra) { const sm = document.createElement('small'); sm.textContent = extra; b.appendChild(sm); }
    tap(b, () => { click(); fn(); }); list.appendChild(b);
  };
  const today = new Date(), dk = dateKey(today);
  const sv = store.get('save', null);
  if (sv) add('Resume ' + LEVELS[sv.level], fmt(sv.elapsed / 1000), resume, 'hot');
  const doneToday = DAILY.filter(lv => results.find(x => x.daily && x.d === dk && x.lv === lv)).length;
  add('All of Today’s Games', doneToday + ' of ' + DAILY.length + ' done', () => showToday(today), sv ? 'gap' : '');
  const r = results.find(x => x.daily && x.d === dk && x.lv === lastLevel);
  add('Today’s ' + LEVELS[lastLevel], r ? '✓ ' + fmt(r.t) + '  ' + ordinal(gridPos(r.p)) : '', () => playDaily(lastLevel, today));
  add('All Difficulties', '', showDifficulties, 'gap');
  add('Another ' + LEVELS[lastLevel], '', () => playAnother(lastLevel));
  add('Training', trainPick.map(t => CORE.TECH_INFO[t].name).join(', ').slice(0, 34), showTraining, 'gap');
  add('Previous Day’s Games', '', showPrevious);
  add('Saved Games', saves.length ? saves.length + ' saved' : '', showSaves);
  $('mver').textContent = 'v' + VERSION + '  ·  ' + (BANK.M.length + BANK.I.length + BANK.D.length + BANK.A.length) + ' puzzles  ·  ' + BANK.TR.length + ' training seeds';
}

// ---- list screens ----
let listBack = 'menu';
function openList(title, back) { $('listTitle').textContent = title; listBack = back || 'menu'; $('listBody').innerHTML = ''; show('list'); return $('listBody'); }
function lrow(body, chipLv, chipText, infoHtml, fn, extraBtn) {
  const row = document.createElement('div'); row.className = 'lrow';
  row.innerHTML = '<div class="chip lv' + chipLv + '"><span>' + chipText + '</span></div><div class="info">' + infoHtml + '</div>';
  if (fn) { row.style.cursor = 'pointer'; tap(row, e => { if (e.target.closest('.xbtn')) return; click(); fn(); }); }
  if (extraBtn) row.appendChild(extraBtn);
  body.appendChild(row); return row;
}
function dayRows(body, d) {
  const dk = dateKey(d);
  for (const lv of DAILY) {
    const r = results.find(x => x.daily && x.d === dk && x.lv === lv);
    lrow(body, lv, LEVELS[lv], '<b>' + (dk === dateKey(new Date()) ? 'Today’s ' : '') + LEVELS[lv] + '</b>' +
      (r ? '<span class="done">✓ ' + fmt(r.t) + ' · ' + ordinal(gridPos(r.p)) + ' of 100 · faster than ' + r.p + '%</span>' : 'Not played yet'),
      () => playDaily(lv, d));
  }
}
function showToday(d) { const b = openList('Today’s Games'); dayRows(b, d); }
function showDifficulties() {
  const b = openList('All Difficulties');
  const desc = { M: 'Hidden and naked singles, pointing', I: 'Adds claiming and naked pairs', D: 'Triples, hidden pairs, X-Wing, uniqueness', A: 'Swordfish, finned fish, hidden triples, W-Wing' };
  for (const lv of DAILY) lrow(b, lv, LEVELS[lv], '<b>Another ' + LEVELS[lv] + '</b>' + desc[lv], () => playAnother(lv));
}
function showPrevious() {
  const b = openList('Previous Days');
  const today = new Date();
  for (let k = 1; k <= 21; k++) {
    const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - k), dk = dateKey(d);
    const n = DAILY.filter(lv => results.find(x => x.daily && x.d === dk && x.lv === lv)).length;
    const label = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    lrow(b, 'T', dk.slice(5), '<b>' + label + '</b>' + (n ? '<span class="done">' + n + ' of 4 played</span>' : 'Not played'), () => { const bb = openList(label, 'prev'); dayRows(bb, d); });
  }
}
function showSaves() {
  const b = openList('Saved Games');
  if (!saves.length) { b.innerHTML = '<p class="note">No saved positions yet. During a game, tap Menu, then Save position.</p>'; return; }
  saves.forEach((sv, k) => {
    const x = document.createElement('button'); x.className = 'xbtn'; x.textContent = '✕';
    tap(x, () => { saves.splice(k, 1); store.set('saves', saves); showSaves(); });
    const st = sv.state, when = new Date(sv.when);
    lrow(b, st.level, LEVELS[st.level], '<b>' + LEVELS[st.level] + ' · ' + fmt(st.elapsed / 1000) + '</b>Saved ' + when.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) +
      ' · ' + st.val.filter(v => v).length + ' of 81 filled', () => {
        if (G && !G.done && screen !== 'game') save();
        G = rebuild(st); hint = null; hintStage = 0; paused = false; wasSolvable = solvable(G, S.pencilMode); save(); show('game'); startClock();
      }, x);
  });
}
const TECH_DESC = {
  SF: 'X-Wing over three rows: one digit fits the same three columns in three rows, so it leaves those columns elsewhere.',
  HT: 'Three digits that, in one house, can only go in the same three cells. Everything else leaves those cells.',
  WW: 'Two cells with the same two possibles, joined by a digit that has only two places in a house.',
  FXW: 'An X-Wing with a fin: an extra possible near one corner. Eliminations happen only in the fin’s block. Includes sashimi.',
  FSF: 'A Swordfish with a fin, as above. Includes sashimi.',
  XY: 'A pivot cell with two possibles and two wing cells; whatever the pivot is, one wing holds the shared digit.',
  XYZ: 'Like XY-Wing, but the pivot has three possibles.',
  SC: 'Follow one digit through houses where it has two places, colouring alternately. A clash or a cell seeing both colours gives eliminations.',
};
function showTraining() {
  const b = openList('Training');
  b.insertAdjacentHTML('beforeend', '<p class="note">Tick the techniques you want to practise. Each puzzle needs at least one of them and nothing beyond Difficult apart from what you tick. The first five come from the original’s Annoying level.</p>');
  const count = document.createElement('p'); count.className = 'note';
  for (const t of TRAIN_TECHS) {
    const row = document.createElement('div'); row.className = 'tech';
    row.innerHTML = '<div class="tick' + (trainPick.includes(t) ? ' on' : '') + '"></div><div class="t"><b>' + CORE.TECH_INFO[t].name +
      '<small>' + (TIER(t) === 4 ? 'ANNOYING' : 'BEYOND') + '</small></b><span>' + TECH_DESC[t] + '</span></div>';
    tap(row, () => { const k = trainPick.indexOf(t); if (k >= 0) trainPick.splice(k, 1); else trainPick.push(t); store.set('trainPick', trainPick); click(); showTraining(); });
    b.appendChild(row);
  }
  const n = trainPick.length ? trainEligible(trainPick).length : 0;
  count.textContent = trainPick.length ? n + ' seed puzzles fit this choice; each is disguised, so every game looks new.' : 'Tick at least one technique.';
  b.appendChild(count);
  const foot = $('listFoot'); foot.innerHTML = '';
  const go = document.createElement('button'); go.className = 'pill go' + (n ? '' : ' off'); go.innerHTML = '<span>Start training</span>';
  tap(go, () => { if (n) { click(); playTraining(); } });
  foot.appendChild(go); foot.appendChild(backBtn());
}
function backBtn() { const bb = document.createElement('button'); bb.className = 'pill'; bb.id = 'bListBack'; bb.innerHTML = '<span>Back</span>'; tap(bb, () => { click(); listBack === 'prev' ? showPrevious() : show('menu'); }); return bb; }
const _show = show;
show = function (name) { if (name === 'list') { const f = $('listFoot'); f.innerHTML = ''; f.appendChild(backBtn()); } _show(name); };

function renderStats() {
  let h = '<table class="st"><thead><tr><th>Level</th><th>Played</th><th>Best</th><th>Average</th><th>Last 10</th><th>Avg %</th><th>Best %</th></tr></thead><tbody>';
  for (const lv of ['M', 'I', 'D', 'A', 'T']) {
    const s = levelStats(results, lv);
    h += '<tr><td><b>' + LEVELS[lv] + '</b></td>' + (s.n ? '<td>' + s.n + '</td><td>' + fmt(s.best) + '</td><td>' + fmt(s.avg) + '</td><td>' + fmt(s.last10) + '</td><td>' + Math.round(s.avgP) + '</td><td>' + s.bestP + '</td>'
      : '<td>0</td><td>–</td><td>–</td><td>–</td><td>–</td><td>–</td>') + '</tr>';
  }
  h += '</tbody></table><p class="note">Percentages are the share of simulated players you were faster than; above 50 beats the typical player. Your grid position is out of 100 simulated drivers.</p>';
  h += '<h2 class="sec">Recent games</h2>';
  const rec = results.slice(-30).reverse();
  if (!rec.length) h += '<p class="note">No completed games yet.</p>';
  else {
    h += '<table class="st"><thead><tr><th>Date</th><th>Game</th><th>Time</th><th>Grid</th><th>Faster than</th></tr></thead><tbody>';
    for (const r of rec) h += '<tr><td>' + r.d + '</td><td style="text-align:right">' + (r.daily ? 'Daily ' : '') + LEVELS[r.lv] + (r.h ? ' (hints)' : '') + '</td><td>' + fmt(r.t) + '</td><td>' + ordinal(gridPos(r.p)) + '</td><td>' + r.p + '%</td></tr>';
    h += '</tbody></table>';
  }
  $('statsBody').innerHTML = h;
  $('bReset').firstChild.textContent = 'Reset'; resetArmed = false;
}
let resetArmed = false;

  ['pmStyle', 'Show possibles', 'How the possibles in each empty cell are drawn.', [['digits', 'Digits'], ['squares', 'Squares'], ['dots', 'Dots'], ['off', 'Off']]],

function renderSettings() {
  const body = $('setBody'), top = body.scrollTop; body.innerHTML = '';
  for (const [key, label, desc, opts] of SETTINGS) {
    if (label === null) { const h = document.createElement('h2'); h.className = 'sec'; h.textContent = key; body.appendChild(h); continue; }
    const row = document.createElement('div'); row.className = 'srow';
    const lab = document.createElement('div'); lab.className = 'lab'; lab.textContent = label;
    const sp = document.createElement('span'); sp.textContent = desc; lab.appendChild(sp);
    const seg = document.createElement('div'); seg.className = 'seg';
    for (const [val, name] of opts) {
      const b = document.createElement('button'); b.textContent = name; if (S[key] === val) b.className = 'on';
      tap(b, () => { S[key] = val; store.set('settings', S); applyScreen(); if (key === 'soundPack') sfx('solved'); else click(); renderSettings(); });
      seg.appendChild(b);
    }
    row.appendChild(lab); row.appendChild(seg); body.appendChild(row);
  }
  body.scrollTop = top;
}
function applyScreen() { $('dim').style.opacity = S.dim ? '0.38' : '0'; }

function renderHelp() {
  $('helpBody').innerHTML = `
<h2 class="sec">Playing</h2>
<ul>
<li><b>Digit first:</b> tap a large digit (it turns green), then tap cells to enter it. The digit stays selected, so you can keep tapping cells.</li>
<li><b>Cell first:</b> tap an empty cell (it turns green), then tap a digit.</li>
<li>Tap the green digit or cell again to deselect it. Tapping a cell that already holds the selected digit clears it.</li>
<li><b>Small digits row:</b> tap one, then tap cells to switch that pencil mark off or on. Or select a cell and tap several of them.</li>
<li><b>Pencil:</b> while on, the large digits change pencil marks instead of entering digits.</li>
<li><b>Erase:</b> tap Erase, then cells to clear them; or select a cell and tap Erase.</li>
<li><b>Undo / Redo:</b> unlimited, back to the start of the game.</li>
<li><b>Menu:</b> pauses the clock and covers the board. From there: Resume, Save position, Restart, or the main menu. Leaving the app or locking the iPad also pauses and saves.</li>
</ul>
<h2 class="sec">Colours</h2>
<p><span class="sw" style="background:#fff56a"></span>cells holding the selected digit
&nbsp; <span class="sw" style="background:#ffc7d6"></span>cells that could hold it</p>
<p><span class="sw" style="background:#2ee06a"></span>selected digit or cell
&nbsp; <span class="sw" style="background:#ffd84a"></span>digit button: all nine placed</p>
<p>A digit in <b style="color:#ff5a5a">red</b> is a mistake (see Mark mistakes in Settings). A finished row, column or block blinks yellow; a finished digit blinks green.</p>
<h2 class="sec">Hint</h2>
<p>Hint first checks the board. A clean board costs nothing; a mistake found costs ${CHECK_PENALTY} seconds, and <b>More</b> then shows where for free. On a clean board, <b>More</b> names the technique and where to look, and <b>More</b> again shows exactly what to do. Those two stages add ${HINT_PENALTY.slice(1, 5).join(', ')} seconds for Moderate, Intricate, Difficult and Annoying techniques. <b>Solution</b> shows every missing digit in red and adds ${fmt(SOLUTION_PENALTY)}; that game is not counted. <b>Fill marks</b> appears with manual pencil marks and fills them in.</p>
<h2 class="sec">Levels</h2>
<p><b>Moderate:</b> hidden singles, naked singles, pointing locked candidates.<br><b>Intricate:</b> adds claiming locked candidates and naked pairs.<br><b>Difficult:</b> adds naked triples, hidden pairs, X-Wing, remote pairs, unique rectangles and BUG+1.<br><b>Annoying:</b> adds Swordfish, finned and sashimi X-Wing and Swordfish, hidden triples and W-Wing.</p>
<p><b>Training</b> lets you tick techniques from Annoying and three from beyond it (XY-Wing, XYZ-Wing, Simple Colours). Each training game is a disguised copy of a seed puzzle: digits relabelled, rows and columns shuffled, so it looks new but needs the same logic.</p>
<p>Every puzzle has exactly one solution, so uniqueness techniques are safe.</p>
<h2 class="sec">The race</h2>
<p>Your time is compared with a simulated field of players, modelled on how many steps of each technique the puzzle needs. The result shows your grid position out of 100 and the share of the field you beat. The pace bar under the clock fills toward the typical time. Daily puzzles are the same for everyone on the same date.</p>`;
}

document.addEventListener('visibilitychange', () => {

});
window.addEventListener('pagehide', () => { if (G && !G.done && screen === 'game') { stopClock(); save(); } });
document.addEventListener('touchmove', e => { if (!e.target.closest || !e.target.closest('.body')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

  if (screen !== 'game' || !G || hint || paused || starting) return;
  if (e.key >= '1' && e.key <= '9') act(() => tapDigit(G, +e.key, S.pencilMode));
  else if (e.key === 'z') act(() => doUndo(G)); else if (e.key === 'y') act(() => doRedo(G));

function unlockAudio() { if (S.soundPack !== 'none' || S.keyClicks) audio(); }
for (const ev of ['touchend', 'pointerup', 'click']) document.addEventListener(ev, unlockAudio, { passive: true });

buildBoard(); fit(); applyScreen(); show('menu');
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
